<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一畳パネル</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f1ecde;--dim:#b4ae9c;--gold:#f2c14e}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{
  color:var(--ink);
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  cursor:none;
}
/* 映像: 画面いっぱいに敷く */
.video{position:fixed;inset:0;overflow:hidden;z-index:0}
.video iframe{
  position:absolute;top:50%;left:50%;
  width:max(100vw,177.78vh);
  height:max(100vh,56.25vw);
  transform:translate(-50%,-50%);
  border:0;background:#000;
  pointer-events:none; /* クリックやキーを親ページで受ける(音ON用) */
}
/* 情報パネル: 左上の半透明の黒枠 */
.panel{
  position:fixed;z-index:2;
  top:3vmin;left:3vmin;
  max-width:48vw;
  box-sizing:border-box;
  padding:2.4vmin 3vmin 2.6vmin;
  background:rgba(0,0,0,.58);
  border-radius:1.4vmin;
}
.time{
  font-weight:700;
  font-size:min(11vw,20vh);
  line-height:1;
  margin:0;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.time .sec{font-size:.28em;color:var(--dim);font-weight:500;margin-left:.15em}
.date{font-size:min(2.6vw,4.6vh);font-weight:500;margin:1.2vh 0 0;letter-spacing:.1em;white-space:nowrap}
.count{margin:2.4vh 0 0;font-size:min(2.3vw,4.2vh);color:var(--dim);letter-spacing:.06em;white-space:nowrap}
.count b{color:var(--gold);font-size:1.8em;font-weight:700;margin:0 .1em;font-variant-numeric:tabular-nums}
.wx{margin:2.4vh 0 0;font-size:min(2vw,3.6vh);letter-spacing:.05em}
.wx .now{display:block;font-size:1.5em;font-weight:700;white-space:nowrap}
.wx .sub{display:block;color:var(--dim);margin-top:.3em;white-space:nowrap}
.hint{position:fixed;z-index:3;right:2vmin;bottom:2vmin;font-size:min(1.8vw,2.8vh);color:#d8d2c0;background:rgba(0,0,0,.45);padding:.4em .8em;border-radius:.6em}
.hint:empty{display:none}
</style>
</head>
<body>
<div class="video" id="video"></div>
<section class="panel">
  <p class="time" id="time">--:--</p>
  <p class="date" id="date"></p>
  <p class="count" id="count" hidden></p>
  <p class="wx" id="wx" hidden></p>
</section>
<div class="hint" id="hint"></div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var S = {
    get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };
  function cfg(k, def){
    var v = q.get(k);
    if (v !== null && v !== '') { S.set('cfg_' + k, v); return v; }
    return S.get('cfg_' + k) || def;
  }
  var target = cfg('d', '2026-12-05');
  var label  = cfg('t', '受験');
  var lat    = parseFloat(cfg('lat', '35.576'));
  var lon    = parseFloat(cfg('lon', '139.659'));
  var vid    = cfg('v', '8fHrDSqHy54');
  if (q.get('v') === 'off') { vid = ''; S.set('cfg_v', ''); }

  var W = ['日','月','火','水','木','金','土'];
  var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
  var el = function(id){ return document.getElementById(id); };

  // ---- 映像 (全画面) + 音 ----
  if (vid) {
    var id = vid.replace(/^.*(?:v=|youtu\.be\/|live\/)/, '').slice(0, 11);
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + id +
      '?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1';
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    el('video').appendChild(f);

    var cmd = function(fn){
      try { f.contentWindow.postMessage(JSON.stringify({event:'command', func:fn, args:[]}), '*'); } catch(e) {}
    };
    var unmuted = false;
    var sound = function(){
      if (unmuted) return;
      unmuted = true;
      cmd('unMute'); cmd('playVideo');
      el('hint').textContent = '';
    };
    ['click','touchstart','keydown','pointerdown'].forEach(function(ev){
      window.addEventListener(ev, sound, {once:true});
    });
    f.addEventListener('load', function(){ setTimeout(function(){ cmd('unMute'); }, 1500); });
    el('hint').textContent = '何かボタンを押すと音が出る';
  }

  // ---- 時計・日付・カウントダウン ----
  function tick(){
    var n = new Date();
    el('time').innerHTML = pad(n.getHours()) + ':' + pad(n.getMinutes()) +
      '<span class="sec">' + pad(n.getSeconds()) + '</span>';
    el('date').textContent = (n.getMonth() + 1) + '月' + n.getDate() + '日　' + W[n.getDay()] + '曜日';
    var p = target.split('-');
    var end = new Date(+p[0], +p[1] - 1, +p[2]);
    if (!isNaN(end.getTime())) {
      var today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
      var days = Math.round((end - today) / 86400000);
      var c = el('count');
      c.hidden = false;
      if (days > 0) c.innerHTML = label + 'まで あと<b>' + days + '</b>日';
      else if (days === 0) c.innerHTML = '<b>今日</b>が' + label;
      else c.innerHTML = label + 'から<b>' + (-days) + '</b>日';
    }
  }
  tick();
  setInterval(tick, 1000);

  // ---- 天気 (Open-Meteo) ----
  function wcode(c){
    if (c === 0) return '快晴';
    if (c <= 2) return '晴れ';
    if (c === 3) return '曇り';
    if (c === 45 || c === 48) return '霧';
    if (c >= 51 && c <= 57) return '霧雨';
    if (c >= 61 && c <= 67) return '雨';
    if (c >= 71 && c <= 77) return '雪';
    if (c >= 80 && c <= 82) return 'にわか雨';
    if (c === 85 || c === 86) return 'にわか雪';
    if (c >= 95) return '雷雨';
    return '—';
  }
  function weather(){
    var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code' +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Asia%2FTokyo&forecast_days=1';
    fetch(u).then(function(r){ return r.json(); }).then(function(j){
      var c = j.current, d = j.daily, w = el('wx');
      w.hidden = false;
      w.innerHTML = '<span class="now">' + wcode(c.weather_code) + ' ' + Math.round(c.temperature_2m) + '°</span>' +
        '<span class="sub">最高' + Math.round(d.temperature_2m_max[0]) + '°　最低' + Math.round(d.temperature_2m_min[0]) +
        '°　降水' + d.precipitation_probability_max[0] + '%</span>';
    }).catch(function(){ el('wx').hidden = true; });
  }
  weather();
  setInterval(weather, 30 * 60 * 1000);
})();
</script>
</body>
</html>
